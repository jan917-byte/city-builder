66" y="161" font-size="10" fill="#555">eau</text><rect x="430" y="167" width="14" height="14" fill="#8c7b6b"/><rect x="446" y="167" width="14" height="14" fill="#c0b6ae"/><text x="466" y="178" font-size="10" fill="#555">camp</text><rect x="430" y="184" width="14" height="14" fill="#c47860"/><rect x="446" y="184" width="14" height="14" fill="#dfb5a8"/><text x="466" y="195" font-size="10" fill="#555">personnes</text><rect x="430" y="201" width="14" height="14" fill="#968c78"/><rect x="446" y="201" width="14" height="14" fill="#c5c0b5"/><text x="466" y="212" font-size="10" fill="#555">pont</text><text x="260" y="250" font-size="10" fill="#555">Gabarit vu de face — même langue que les icônes du jeu :</text><text x="260" y="264" font-size="10" fill="#555">trait noir de 2 cases (20 unités), bouts et angles arrondis ;</text><text x="260" y="278" font-size="10" fill="#555">aplats pleins, en pastel (2e carré) ; la teinte vive pour un détail.</text><text x="260" y="292" font-size="10" fill="#555">Pointillés rouges : la marge ; ligne bleue : le sol.</text><text x="260" y="306" font-size="10" fill="#555">Enregistrer sous Godot/icones/⟨nom⟩.svg (noms sur la planche).</text><text x="260" y="320" font-size="10" fill="#555">Dessiner sur un autre calque : le groupe « gabarit » est retiré.</text>
